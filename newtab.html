<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1333;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 30px;
    font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    max-width: 1400px;
    width: 100%;
  }

  .tile {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    display: block;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .tile:hover {
    transform: scale(1.04);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  }

  .tile:active {
    transform: scale(0.98);
  }

  .tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .tile .label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.35);
    transition: background 0.2s ease;
  }

  .tile:hover .label {
    background: rgba(0, 0, 0, 0.15);
  }

  .tile .label span {
    color: #fff;
    font-size: 1.4rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    text-align: center;
    padding: 0 10px;
  }
</style>
</head>
<body>

<div class="grid" id="grid"></div>

<script>
  // ============================================================
  //  EDIT THIS ARRAY to add/remove/reorder tiles.
  //  Each object needs: label, url, and image.
  // ============================================================
  const tiles = [
    { label: "Claude", url: "https://claude.ai", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "TrueNAS",           url: "10.0.0.259:81", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "NextCloud",        url: "https://cloud.treehousegaming.club", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "NPM",    url: "10.0.0.239:82", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "Portainer",            url: "10.0.0.239:31015", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "Jellyfin (Local)",       url: "10.0.0.239:30041", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "Jellyfin (Web)",         url: "jelly.treehousegaming.club", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "Immich (Local)",          url: "10.0.0.239:30041", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "Immich (Web)",           url: "https://photos.treehousegaming.club", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "Cameras (Local)",      url: "10.0.0.239:8971", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "Cameras (Web)",      url: "https://eyes.treehousegaming.club", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "Jeffpedia",           url: "10.0.0.159", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "Xfinity Gateway",         url: "10.0.0.1", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "Photopea",          url: "https://www.photopea.com", image: "https://wallpaperaccess.com/full/1078164.jpg" },
    { label: "Cloudflare",      url: "https://dash.cloudflare.com/2f520edeb3ff2e2032f65dc45b7a7c1a/home/overview", image: "https://wallpaperaccess.com/full/1078164.jpg" },
  ];

  // Build the grid
  const grid = document.getElementById("grid");
  tiles.forEach(t => {
    const a = document.createElement("a");
    a.className = "tile";
    a.href = t.url;
    a.innerHTML = `
      <img src="${t.image}" alt="${t.label}" loading="lazy">
      <div class="label"><span>${t.label}</span></div>
    `;
    grid.appendChild(a);
  });
</script>

</body>
</html>
