# HYPRIDLE CONFIG TEMPLATE

# Global settings
general {
    lock_cmd = pidof hyprlock || hyprlock       # command to lock the screen
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on # wake displays
}

# Idle behavior
listener {
    # Time before screen dims (in seconds)
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Locks and suspend are skipped in "nolock" mode (toggled via waybar's
# brightness module, middle-click) — see ~/.config/hypr/Scripts/idle-guard.sh
listener {
    # Time before system locks
    timeout = 600
    on-timeout = ~/.config/hypr/Scripts/idle-guard.sh 'pidof hyprlock || hyprlock'
}

listener {
    # Time before system suspends
    timeout = 1800
    on-timeout = ~/.config/hypr/Scripts/idle-guard.sh 'systemctl shutdown'
}

